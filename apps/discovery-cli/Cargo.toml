[package]
name = "discovery-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
discovery = { path = "../../crates/discovery" }
# ADR-024: the render seam validates every row against the shared slug grammar and
# bound, so it reads the predicate and the escaped-echo renderer from the root.
bindforge-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
