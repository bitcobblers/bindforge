# cargo-deny configuration for the scheduled scan
# (.github/workflows/advisories.yml) — design 008, "Gates".
#
# The scheduled job runs `cargo deny check`, so every section below is a
# policy that actually runs: advisories, bans (duplicate versions), licenses,
# and sources. The scan is triage input, not a PR gate — findings are the
# maintainer's to triage within the week, and the job stays green so a live
# advisory database cannot turn anything red. A waiver of a reported advisory
# is recorded under [advisories] `ignore` as the advisory id (cargo-deny
# spells the advisory waiver `ignore`; `skip` is its license-section key).
# A27: this scan's crates.io/RustSec data does not carry every framework
# advisory (Tauri's own repository advisory list is one that it misses), so
# frameworks keep checking their own lists too.

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
